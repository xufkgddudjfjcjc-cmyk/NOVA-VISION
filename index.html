<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA VISION — V5.1 Camera Diagnostic</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#app{position:relative;width:100%;height:100%}#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#111;display:block}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#shade{position:absolute;inset:0;background:linear-gradient(#0003,#0000 25%,#0004);pointer-events:none}
header{position:absolute;z-index:5;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-shadow:0 1px 6px #000}.brand{font-weight:700}.live{display:flex;gap:7px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:#ffd21c;box-shadow:0 0 12px #ffd21c}
.panel{position:absolute;z-index:5;left:20px;bottom:20px;width:285px;padding:13px 15px;border:1px solid #ffffff35;background:#000b;border-radius:11px;backdrop-filter:blur(10px)}
.row{display:flex;justify-content:space-between;gap:20px;font-size:9px;line-height:2.1;color:#aaa}.row b{color:#fff;font-weight:500;text-align:right;max-width:175px;overflow-wrap:anywhere}
#start{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 24px;border:1px solid #ffd21c;border-radius:11px;background:#080808ed;color:#fff;font-size:13px;letter-spacing:.08em;cursor:pointer}
#start:disabled{opacity:.55}
#message{position:absolute;z-index:6;left:50%;top:58%;transform:translateX(-50%);font-size:10px;opacity:.75;text-align:center;max-width:80%;line-height:1.7;text-shadow:0 1px 5px #000}
#again{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);display:none;padding:14px 24px;border:1px solid #ffd21c;border-radius:11px;background:#080808ed;color:#fff;font-size:13px;letter-spacing:.08em;cursor:pointer}
</style>
</head>
<body>
<div id="app">
<video id="camera" autoplay playsinline muted></video><canvas id="fx"></canvas><div id="shade"></div>
<header><div class="brand">NOVA / VISION 05.1</div><div class="live"><span class="dot"></span><span id="status">CAMERA DIAGNOSTIC</span></div></header>
<div class="panel">
<div class="row"><span>SECURE CONTEXT</span><b id="secure">CHECKING</b></div>
<div class="row"><span>CAMERA API</span><b id="api">CHECKING</b></div>
<div class="row"><span>PERMISSION</span><b id="permission">CHECKING</b></div>
<div class="row"><span>DEVICE</span><b id="device">CHECKING</b></div>
<div class="row"><span>ERROR</span><b id="error">NONE</b></div>
<div class="row"><span>VIDEO</span><b id="videoState">WAITING</b></div>
</div>
<button id="start">CHECK CAMERA</button>
<button id="again">TRY AGAIN</button>
<div id="message">V5.1 · 摄像头诊断模式</div>
</div>
<script>
const video=document.getElementById("camera"),start=document.getElementById("start"),again=document.getElementById("again");
const $=id=>document.getElementById(id);let stream=null;

function set(id,text){$(id).textContent=text}
function secureCheck(){
 const ok=window.isSecureContext;
 set("secure",ok?"OK":"BLOCKED");
 set("api",navigator.mediaDevices&&navigator.mediaDevices.getUserMedia?"AVAILABLE":"MISSING");
 return ok;
}
async function stop(){
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 video.srcObject=null;
}
async function check(){
 await stop();again.style.display="none";start.style.display="block";start.disabled=true;
 set("status","CHECKING");set("error","NONE");set("permission","REQUESTING");set("device","CHECKING");set("videoState","WAITING");
 const secure=secureCheck();
 if(!secure){set("permission","BLOCKED");set("error","INSECURE_CONTEXT");set("status","ERROR");start.disabled=false;again.style.display="block";return}
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){set("error","NO_GETUSERMEDIA");set("status","ERROR");start.disabled=false;again.style.display="block";return}
 try{
  // 先查询权限；Safari/旧浏览器可能不支持 permissions.camera，这里只作为辅助诊断
  if(navigator.permissions?.query){
   try{const q=await navigator.permissions.query({name:"camera"});set("permission",q.state.toUpperCase())}catch(_){}
  }
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:480,max:640},height:{ideal:360,max:480}},audio:false});
  const tracks=stream.getVideoTracks(),track=tracks[0];
  set("permission","GRANTED");set("device",track?track.label||"CAMERA FOUND":"CAMERA FOUND");
  video.srcObject=stream;await video.play();
  set("videoState",video.videoWidth+" × "+video.videoHeight);
  set("status","CAMERA OK");set("error","NONE");
  start.style.display="none";again.style.display="block";$("message").textContent="摄像头已经成功打开。下一步再接入 AI。";
 }catch(e){
  console.error(e);
  set("status","ERROR");set("error",(e.name||"UNKNOWN")+" — "+(e.message||""));
  if(e.name==="NotAllowedError"||e.name==="SecurityError")set("permission","BLOCKED");
  else if(e.name==="NotFoundError")set("device","NOT FOUND");
  else if(e.name==="NotReadableError")set("device","BUSY / IN USE");
  else set("device","CHECK REQUIRED");
  $("message").textContent="诊断完成：请把左下角 ERROR 那一行截图发给我。";
  start.disabled=false;start.style.display="none";again.style.display="block";
 }
}
start.onclick=check;again.onclick=check;secureCheck();
</script>
</body></html>
