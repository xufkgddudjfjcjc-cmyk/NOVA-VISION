<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOVA VISION — V5.3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030303;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#app{position:relative;width:100%;height:100%}#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#080808}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 5px,rgba(255,255,255,.016) 6px)}
header{position:absolute;z-index:5;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;font-size:11px;letter-spacing:.14em;text-shadow:0 1px 6px #000}.brand{font-weight:700}.live{display:flex;gap:7px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:#ffd21c;box-shadow:0 0 12px #ffd21c}
.panel{position:absolute;z-index:5;left:20px;bottom:20px;padding:11px 14px;border:1px solid #ffffff28;background:#0009;border-radius:10px;min-width:245px}.row{display:flex;justify-content:space-between;gap:28px;font-size:9px;line-height:2;color:#aaa}.row b{color:#fff;font-weight:500}
#handToggle{border:1px solid #ffffff35;background:#111;color:#aaa;border-radius:6px;padding:2px 7px;font-size:8px;cursor:pointer}#handToggle.on{border-color:#ffd21c;color:#ffd21c}
#start{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 23px;border:1px solid #ffd21c;border-radius:11px;background:#080808ed;color:#fff;font-size:13px;letter-spacing:.08em;cursor:pointer}
#message{position:absolute;z-index:5;left:50%;bottom:20px;transform:translateX(-50%);font-size:9px;opacity:.55;white-space:nowrap;text-shadow:0 1px 5px #000}
</style>
</head>
<body><div id="app">
<video id="camera" autoplay playsinline muted></video><canvas id="fx"></canvas><div id="scan"></div>
<header><div class="brand">NOVA / VISION 05.3</div><div class="live"><span class="dot"></span><span id="status">STANDBY</span></div></header>
<div class="panel">
<div class="row"><span>CAMERA</span><b id="cam">OFF</b></div>
<div class="row"><span>FACE AI</span><b id="face">OFF</b></div>
<div class="row"><span>HAND AI</span><button id="handToggle">OFF</button></div>
<div class="row"><span>FACE</span><b id="detected">NOT FOUND</b></div>
<div class="row"><span>GESTURE</span><b id="gesture">NONE</b></div>
<div class="row"><span>PARTICLES</span><b id="count">0</b></div>
<div class="row"><span>RENDER FPS</span><b id="fps">--</b></div>
<div class="row"><span>AI FPS</span><b id="aifps">--</b></div>
</div>
<button id="start">START CAMERA</button><div id="message">V5.3 STABLE · HAND AI 默认关闭</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
const video=document.getElementById("camera"),canvas=document.getElementById("fx"),ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,stream=null,faceMesh=null,hands=null,running=false,busy=false,handOn=false;
let face=null,hand=null,particles=[],lastFace=0,lastHand=0,renderFrames=0,aiFrames=0,lastStats=performance.now();

function resize(){dpr=Math.min(devicePixelRatio||1,1.25);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();
function p(q){return{x:(1-q.x)*W,y:q.y*H}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function faceBox(lm){
 let x1=1,y1=1,x2=0,y2=0;for(const q of lm){x1=Math.min(x1,q.x);y1=Math.min(y1,q.y);x2=Math.max(x2,q.x);y2=Math.max(y2,q.y)}
 const A=p({x:x1,y:y1}),B=p({x:x2,y:y2}),r={x:Math.min(A.x,B.x)-8,y:Math.min(A.y,B.y)-8,w:Math.abs(B.x-A.x)+16,h:Math.abs(B.y-A.y)+16};
 ctx.save();ctx.strokeStyle="#ffd21c";ctx.lineWidth=1.8;ctx.shadowColor="#ffd21c";ctx.shadowBlur=8;ctx.strokeRect(r.x,r.y,r.w,r.h);ctx.shadowBlur=0;ctx.fillStyle="#ffd21c";ctx.font="9px sans-serif";ctx.fillText("FACE // LOCKED",r.x,r.y-8);ctx.restore();return r
}
function drawHand(lm){
 const links=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20]];
 ctx.save();ctx.strokeStyle="#ffd21c";ctx.fillStyle="#ffd21c";ctx.lineWidth=1;ctx.globalAlpha=.78;
 for(const z of links){let a=p(lm[z[0]]),b=p(lm[z[1]]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 [4,8,12,16,20].forEach(i=>{let q=p(lm[i]);ctx.beginPath();ctx.arc(q.x,q.y,2.5,0,Math.PI*2);ctx.fill()});ctx.restore()
}
function spawn(cx,cy,n=2){
 if(particles.length>65)return;
 for(let i=0;i<n;i++){let a=Math.random()*6.28,s=.3+Math.random()*1.1;particles.push({x:cx+(Math.random()-.5)*18,y:cy+(Math.random()-.5)*18,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:28+Math.random()*42})}
}
function render(){
 if(!running)return;ctx.clearRect(0,0,W,H);let target=null;
 if(face&&performance.now()-lastFace<900){let b=faceBox(face);target={x:b.x+b.w/2,y:b.y+b.h/2};$("detected").textContent="DETECTED";$("face").textContent="TRACKING"}
 else{$("detected").textContent="NOT FOUND";$("face").textContent="SEARCHING"}
 if(handOn&&hand&&performance.now()-lastHand<1200){drawHand(hand);const palm=p(hand[9]);target=palm;$("gesture").textContent=dist(hand[4],hand[8])<.055?"PINCH":"HAND";spawn(palm.x,palm.y,2)}
 else if(handOn){$("gesture").textContent="SEARCHING"}
 if(target)for(const q of particles){q.vx+=(target.x-q.x)*.00065;q.vy+=(target.y-q.y)*.00065}
 ctx.save();ctx.fillStyle="#ffd21c";ctx.shadowColor="#ffd21c";ctx.shadowBlur=6;
 for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.x+=q.vx;q.y+=q.vy;q.vx*=.992;q.vy*=.992;q.life--;ctx.globalAlpha=Math.max(0,q.life/70);ctx.fillRect(q.x,q.y,1.6,1.6);if(q.life<=0)particles.splice(i,1)}
 ctx.restore();$("count").textContent=particles.length;
 renderFrames++;const now=performance.now();if(now-lastStats>1000){$("fps").textContent=renderFrames;$("aifps").textContent=aiFrames;renderFrames=0;aiFrames=0;lastStats=now}requestAnimationFrame(render)
}
async function aiLoop(){
 if(!running)return;const now=performance.now();
 if(!busy){busy=true;try{
  if(now-lastFace>=230){lastFace=now;await faceMesh.send({image:video});aiFrames++}
  if(handOn&&now-lastHand>=650){lastHand=now;await hands.send({image:video});aiFrames++}
 }catch(e){console.warn("AI frame skipped",e)}busy=false}
 setTimeout(aiLoop,35)
}
async function initAI(){
 faceMesh=new FaceMesh({locateFile:f=>"https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"+f});
 faceMesh.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:.55,minTrackingConfidence:.55});
 faceMesh.onResults(r=>{face=(r.multiFaceLandmarks||[])[0]||null});
 hands=new Hands({locateFile:f=>"https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+f});
 hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.6});
 hands.onResults(r=>{hand=(r.multiHandLandmarks||[])[0]||null});
}
$("handToggle").onclick=()=>{
 handOn=!handOn;$("handToggle").textContent=handOn?"ON":"OFF";$("handToggle").classList.toggle("on",handOn);
 if(!handOn){hand=null;$("gesture").textContent="NONE";$("hand").textContent="OFF"}else $("hand").textContent="READY";
}
$("start").onclick=async()=>{
 const b=$("start");b.disabled=true;$("status").textContent="STARTING";
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:480,max:640},height:{ideal:360,max:480},frameRate:{ideal:24,max:30},facingMode:"user"},audio:false});
  video.srcObject=stream;await video.play();$("cam").textContent="ON";$("status").textContent="LIVE";b.style.display="none";
  await initAI();$("face").textContent="READY";running=true;render();aiLoop();
 }catch(e){console.error(e);$("status").textContent="ERROR";$("cam").textContent="ERROR";b.disabled=false;b.textContent="TRY AGAIN";$("message").textContent="摄像头失败："+(e.name||"UNKNOWN")}
};
</script></body></html>
