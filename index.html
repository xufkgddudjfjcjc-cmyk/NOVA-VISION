<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOVA VISION — V5 Particle World</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020202;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#app{position:relative;width:100%;height:100%}#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#080808;display:block;filter:saturate(.8) contrast(1.04)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 5px,rgba(255,255,255,.018) 6px)}
header{position:absolute;z-index:5;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;letter-spacing:.14em;font-size:11px;text-shadow:0 1px 6px #000}.brand{font-weight:700}.live{display:flex;gap:7px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:#ffd21c;box-shadow:0 0 12px #ffd21c}
.panel{position:absolute;z-index:5;left:20px;bottom:20px;padding:11px 14px;border:1px solid #ffffff28;background:#0009;border-radius:10px;min-width:215px}.row{display:flex;justify-content:space-between;gap:28px;font-size:9px;line-height:1.9;color:#aaa}.row b{color:#fff;font-weight:500}
#start{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);padding:13px 22px;border:1px solid #ffd21c;border-radius:11px;background:#080808ee;color:#fff;font-size:13px;letter-spacing:.07em;cursor:pointer}
#hint{position:absolute;z-index:5;left:50%;bottom:20px;transform:translateX(-50%);font-size:9px;opacity:.58;white-space:nowrap;text-shadow:0 1px 5px #000}
#flash{position:absolute;inset:0;background:#ffd21c;opacity:0;pointer-events:none;z-index:2}
</style>
</head>
<body><div id="app">
<video id="camera" autoplay playsinline muted></video><canvas id="fx"></canvas><div id="scan"></div><div id="flash"></div>
<header><div class="brand">NOVA / VISION 05</div><div class="live"><span class="dot"></span><span id="status">STANDBY</span></div></header>
<div class="panel">
<div class="row"><span>FACE CORE</span><b id="face">OFF</b></div>
<div class="row"><span>HAND CORE</span><b id="hand">OFF</b></div>
<div class="row"><span>MODE</span><b id="mode">IDLE</b></div>
<div class="row"><span>ENERGY</span><b id="energy">0%</b></div>
<div class="row"><span>PARTICLES</span><b id="count">0</b></div>
<div class="row"><span>FPS</span><b id="fps">--</b></div>
</div>
<button id="start">START CAMERA</button>
<div id="hint">手掌吸引 · 握拳聚拢 · 张开爆发 · 捏合抓取</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
const video=document.getElementById("camera"),canvas=document.getElementById("fx"),ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,stream=null,faceMesh=null,hands=null,running=false,busy=false;
let face=null,hand=null,particles=[],lastFace=0,lastHand=0,lastStats=performance.now(),frames=0,energy=0;
let prevPalm=null,grabbed=false,burstCooldown=0;

function resize(){dpr=Math.min(devicePixelRatio||1,1.25);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();
function p(q){return{x:(1-q.x)*W,y:q.y*H}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function spawn(x,y,n=2,power=1){
 if(particles.length>110)return;
 for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=(.25+Math.random()*1.2)*power;particles.push({x:x+(Math.random()-.5)*25,y:y+(Math.random()-.5)*25,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:35+Math.random()*65,size:.8+Math.random()*1.5})}
}
function burst(x,y){if(performance.now()<burstCooldown)return;burstCooldown=performance.now()+800;spawn(x,y,35,2.5);$("mode").textContent="BURST";energy=Math.min(100,energy+18);document.getElementById("flash").style.opacity=".13";setTimeout(()=>document.getElementById("flash").style.opacity="0",80)}
function faceBox(lm){
 let x1=1,y1=1,x2=0,y2=0;for(const q of lm){x1=Math.min(x1,q.x);y1=Math.min(y1,q.y);x2=Math.max(x2,q.x);y2=Math.max(y2,q.y)}
 const A=p({x:x1,y:y1}),B=p({x:x2,y:y2}),r={x:Math.min(A.x,B.x)-7,y:Math.min(A.y,B.y)-7,w:Math.abs(B.x-A.x)+14,h:Math.abs(B.y-A.y)+14};
 ctx.save();ctx.strokeStyle="#ffd21c";ctx.lineWidth=1.7;ctx.shadowColor="#ffd21c";ctx.shadowBlur=8;ctx.strokeRect(r.x,r.y,r.w,r.h);ctx.shadowBlur=0;ctx.fillStyle="#ffd21c";ctx.font="9px sans-serif";ctx.fillText("FACE CORE",r.x,r.y-7);ctx.restore();return r
}
function drawHand(lm){
 const links=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20]];
 ctx.save();ctx.strokeStyle="#ffd21c";ctx.fillStyle="#ffd21c";ctx.lineWidth=1;ctx.globalAlpha=.72;
 for(const z of links){let a=p(lm[z[0]]),b=p(lm[z[1]]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 [4,8,12,16,20].forEach(i=>{let q=p(lm[i]);ctx.beginPath();ctx.arc(q.x,q.y,2.4,0,Math.PI*2);ctx.fill()});ctx.restore()
}
function render(){
 if(!running)return;
 ctx.clearRect(0,0,W,H);
 let target=null;
 if(face&&performance.now()-lastFace<850){let b=faceBox(face);target={x:b.x+b.w/2,y:b.y+b.h/2};$("face").textContent="TRACKING"}
 else $("face").textContent="SEARCHING";
 if(hand&&performance.now()-lastHand<1000){
  drawHand(hand);$("hand").textContent="TRACKING";
  const palm=p(hand[9]);target=palm;
  const pinch=dist(hand[4],hand[8]);
  const fingers=[8,12,16,20].map(i=>dist(hand[i],hand[0])>dist(hand[5],hand[0])*.95);
  const open=fingers.filter(Boolean).length>=3, fist=fingers.filter(Boolean).length===0;
  if(pinch<.055){$("mode").textContent="GRAB";grabbed=true;spawn(palm.x,palm.y,4,1.3)}
  else if(open){$("mode").textContent="OPEN";if(!prevPalm||dist(palm,prevPalm)>18)burst(palm.x,palm.y)}
  else if(fist){$("mode").textContent="PULL";energy=Math.min(100,energy+1)}
  else if($("mode").textContent==="GRAB"||$("mode").textContent==="PULL"){$("mode").textContent="HAND"}
  prevPalm=palm;
 }else{$("hand").textContent="SEARCHING";prevPalm=null;grabbed=false}
 if(target){
  const pull=hand?0.0012:0.0005;
  for(const q of particles){q.vx+=(target.x-q.x)*pull;q.vy+=(target.y-q.y)*pull}
  spawn(target.x,target.y,1)
 }
 ctx.save();ctx.fillStyle="#ffd21c";ctx.shadowColor="#ffd21c";ctx.shadowBlur=6;
 for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.x+=q.vx;q.y+=q.vy;q.vx*=.992;q.vy*=.992;q.life--;ctx.globalAlpha=Math.max(0,q.life/100);ctx.fillRect(q.x,q.y,q.size,q.size);if(q.life<=0)particles.splice(i,1)}
 ctx.restore();
 energy=Math.max(0,energy-.08);$("energy").textContent=Math.round(energy)+"%";$("count").textContent=particles.length;
 frames++;const now=performance.now();if(now-lastStats>1000){$("fps").textContent=frames;frames=0;lastStats=now}requestAnimationFrame(render)
}
async function aiLoop(){
 if(!running)return;
 const now=performance.now();
 if(!busy){
  busy=true;
  try{
   if(now-lastFace>220){lastFace=now;await faceMesh.send({image:video})}
   if(now-lastHand>600){lastHand=now;await hands.send({image:video})}
  }catch(e){console.warn("AI skipped",e)}
  busy=false;
 }
 setTimeout(aiLoop,35)
}
async function initAI(){
 faceMesh=new FaceMesh({locateFile:f=>"https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"+f});
 faceMesh.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:.55,minTrackingConfidence:.55});
 faceMesh.onResults(r=>{face=(r.multiFaceLandmarks||[])[0]||null});
 hands=new Hands({locateFile:f=>"https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+f});
 hands.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.6});
 hands.onResults(r=>{hand=(r.multiHandLandmarks||[])[0]||null});
}
$("start").onclick=async()=>{
 const b=$("start");b.disabled=true;$("status").textContent="STARTING";
 try{
  stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:480,max:640},height:{ideal:360,max:480},frameRate:{ideal:24,max:30},facingMode:"user"},audio:false});
  video.srcObject=stream;await video.play();running=true;$("cam").textContent="ON";$("status").textContent="LIVE";b.style.display="none";
  await initAI();render();aiLoop();
 }catch(e){console.error(e);$("status").textContent="ERROR";b.disabled=false;b.textContent="TRY AGAIN";alert("请使用 HTTPS / GitHub Pages / localhost，并允许摄像头权限。")}
};
</script></body></html>
