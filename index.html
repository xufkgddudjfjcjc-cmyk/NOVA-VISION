<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOVA VISION — V4.1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030303;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#app{position:relative;width:100%;height:100%}#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#111;display:block}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 3px,rgba(255,255,255,.025) 4px)}
header{position:absolute;z-index:5;top:22px;left:24px;right:24px;display:flex;justify-content:space-between;letter-spacing:.15em;font-size:12px;text-shadow:0 1px 5px #000}.brand{font-weight:700}.live{display:flex;gap:8px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#ffd21c;box-shadow:0 0 14px #ffd21c}
.panel{position:absolute;z-index:5;left:24px;bottom:24px;padding:13px 16px;border:1px solid #ffffff35;background:#0009;backdrop-filter:blur(10px);border-radius:12px;min-width:230px}.row{display:flex;justify-content:space-between;gap:30px;font-size:10px;line-height:2.05;color:#aaa}.row b{color:#fff;font-weight:500}
#start{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);padding:14px 24px;border:1px solid #ffd21c;border-radius:12px;background:#080808ee;color:#fff;font-size:14px;letter-spacing:.08em;cursor:pointer}
#hint{position:absolute;z-index:5;left:50%;bottom:26px;transform:translateX(-50%);font-size:10px;opacity:.6;white-space:nowrap;text-shadow:0 1px 5px #000}
#error{position:absolute;z-index:8;left:50%;top:12%;transform:translateX(-50%);max-width:90%;padding:9px 13px;border:1px solid #ffffff28;border-radius:9px;background:#000b;font-size:11px;display:none}
</style>
</head>
<body>
<div id="app">
<video id="camera" autoplay playsinline muted></video>
<canvas id="fx"></canvas><div id="scan"></div>
<header><div class="brand">NOVA / VISION 04.1</div><div class="live"><span class="dot"></span><span id="status">STANDBY</span></div></header>
<div class="panel">
<div class="row"><span>CAMERA</span><b id="cam">OFF</b></div>
<div class="row"><span>FACE AI</span><b id="face">OFF</b></div>
<div class="row"><span>HAND AI</span><b id="hand">OFF</b></div>
<div class="row"><span>GESTURE</span><b id="gesture">NONE</b></div>
<div class="row"><span>FPS</span><b id="fps">--</b></div>
</div>
<button id="start">START CAMERA</button>
<div id="hint">如果 AI 暂时失效，摄像头画面仍会保持显示</div><div id="error"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
const video=document.getElementById("camera"),canvas=document.getElementById("fx"),ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,mirror=true,faceMesh,handModel,cameraStream;
let faceLandmarks=null,handLandmarks=null,particles=[],running=false,aiBusy=false,lastAI=0,frames=0,lastFPS=performance.now();

function resize(){dpr=Math.min(devicePixelRatio||1,1.5);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();

function p(q){return{x:(mirror?1-q.x:q.x)*W,y:q.y*H}}
function box(lm){
 let a=1,b=1,d=0,e=0;for(const q of lm){a=Math.min(a,q.x);b=Math.min(b,q.y);d=Math.max(d,q.x);e=Math.max(e,q.y)}
 const A=p({x:a,y:b}),B=p({x:d,y:e}),r={x:Math.min(A.x,B.x)-8,y:Math.min(A.y,B.y)-8,w:Math.abs(B.x-A.x)+16,h:Math.abs(B.y-A.y)+16};
 ctx.save();ctx.strokeStyle="#ffd21c";ctx.lineWidth=2;ctx.shadowColor="#ffd21c";ctx.shadowBlur=8;ctx.strokeRect(r.x,r.y,r.w,r.h);ctx.shadowBlur=0;ctx.fillStyle="#ffd21c";ctx.font="10px sans-serif";ctx.fillText("FACE // LOCKED",r.x,r.y-8);ctx.restore();return r
}
function drawHand(lm){
 const links=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20]];
 ctx.save();ctx.strokeStyle="#ffd21c";ctx.fillStyle="#ffd21c";ctx.lineWidth=1.3;ctx.globalAlpha=.85;
 links.forEach(z=>{let a=p(lm[z[0]]),b=p(lm[z[1]]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()});
 [4,8,12,16,20].forEach(i=>{let q=p(lm[i]);ctx.beginPath();ctx.arc(q.x,q.y,3,0,Math.PI*2);ctx.fill()});ctx.restore()
}
function spawn(cx,cy,n=3){
 for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=.5+Math.random()*2;particles.push({x:cx+(Math.random()-.5)*18,y:cy+(Math.random()-.5)*18,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:30+Math.random()*55})}
}
function drawParticles(target){
 ctx.save();ctx.fillStyle="#ffd21c";ctx.shadowColor="#ffd21c";ctx.shadowBlur=7;
 for(let i=particles.length-1;i>=0;i--){let q=particles[i];if(target){q.vx+=(target.x-q.x)*.001;q.vy+=(target.y-q.y)*.001}q.x+=q.vx;q.y+=q.vy;q.vx*=.985;q.vy*=.985;q.life--;ctx.globalAlpha=Math.max(0,q.life/80);ctx.fillRect(q.x,q.y,2,2);if(q.life<=0)particles.splice(i,1)}ctx.restore()
}
function showError(msg){$("error").textContent=msg;$("error").style.display="block";setTimeout(()=>$("error").style.display="none",5000)}

async function initAI(){
 faceMesh=new FaceMesh({locateFile:f=>"https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"+f});
 faceMesh.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:.5,minTrackingConfidence:.5});
 faceMesh.onResults(r=>{faceLandmarks=(r.multiFaceLandmarks||[])[0]||null});
 handModel=new Hands({locateFile:f=>"https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+f});
 handModel.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.55,minTrackingConfidence:.55});
 handModel.onResults(r=>{handLandmarks=(r.multiHandLandmarks||[])[0]||null});
 $("face").textContent="READY";$("hand").textContent="READY";
}

function draw(){
 if(!running)return;
 ctx.clearRect(0,0,W,H);
 let target=null;
 if(faceLandmarks){let b=box(faceLandmarks);target={x:b.x+b.w/2,y:b.y+b.h/2};$("face").textContent="TRACKING";spawn(target.x,target.y,1)}else $("face").textContent="SEARCHING";
 if(handLandmarks){drawHand(handLandmarks);$("hand").textContent="TRACKING";const palm=p(handLandmarks[9]);target=palm;spawn(palm.x,palm.y,2);
   const pinch=Math.hypot(handLandmarks[4].x-handLandmarks[8].x,handLandmarks[4].y-handLandmarks[8].y);
   $("gesture").textContent=pinch<.055?"PINCH":"HAND";
 }else{$("hand").textContent="SEARCHING";if(!faceLandmarks)$("gesture").textContent="NONE"}
 drawParticles(target);
 frames++;let now=performance.now();if(now-lastFPS>1000){$("fps").textContent=Math.round(frames*1000/(now-lastFPS));frames=0;lastFPS=now}
 requestAnimationFrame(draw);
}

async function aiLoop(){
 if(!running)return;
 const now=performance.now();
 // 老 Mac 上让 AI 低频运行；摄像头视频本身不依赖 AI
 if(!aiBusy && now-lastAI>180){
   aiBusy=true;lastAI=now;
   try{await faceMesh.send({image:video})}catch(e){console.warn("face",e)}
   // 每约 360ms 再跑一次手部，减少双模型竞争
   if(now%720<360){try{await handModel.send({image:video})}catch(e){console.warn("hand",e)}}
   aiBusy=false;
 }
 setTimeout(aiLoop,40);
}

$("start").onclick=async()=>{
 const btn=$("start");btn.disabled=true;$("status").textContent="STARTING";
 try{
   cameraStream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:640,max:640},height:{ideal:480,max:480},facingMode:"user"},audio:false});
   video.srcObject=cameraStream;await video.play();
   $("cam").textContent="ON";$("status").textContent="LIVE";running=true;btn.style.display="none";
   await initAI();draw();aiLoop();
 }catch(e){
   console.error(e);$("cam").textContent="ERROR";$("status").textContent="ERROR";btn.disabled=false;btn.textContent="TRY AGAIN";
   showError("摄像头启动失败："+(e.name||"Unknown")+". 请检查浏览器摄像头权限，并确认使用 HTTPS / GitHub Pages / localhost。");
 }
};
</script>
</body></html>
