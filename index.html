<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NOVA VISION — V4.2 LITE</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030303;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
#app{position:relative;width:100%;height:100%}#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);background:#111;display:block}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,transparent 0,transparent 5px,rgba(255,255,255,.018) 6px)}
header{position:absolute;z-index:5;top:20px;left:20px;right:20px;display:flex;justify-content:space-between;letter-spacing:.14em;font-size:11px;text-shadow:0 1px 5px #000}.brand{font-weight:700}.live{display:flex;gap:7px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;background:#ffd21c;box-shadow:0 0 10px #ffd21c}
.panel{position:absolute;z-index:5;left:20px;bottom:20px;padding:11px 14px;border:1px solid #ffffff28;background:#0009;border-radius:10px;min-width:205px}.row{display:flex;justify-content:space-between;gap:25px;font-size:9px;line-height:1.9;color:#999}.row b{color:#fff;font-weight:500}
#start{position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);padding:13px 22px;border:1px solid #ffd21c;border-radius:11px;background:#080808ee;color:#fff;font-size:13px;letter-spacing:.07em}
#hint{position:absolute;z-index:5;left:50%;bottom:20px;transform:translateX(-50%);font-size:9px;opacity:.55;white-space:nowrap;text-shadow:0 1px 5px #000}
</style>
</head>
<body><div id="app">
<video id="camera" autoplay playsinline muted></video><canvas id="fx"></canvas><div id="scan"></div>
<header><div class="brand">NOVA / VISION 04.2 LITE</div><div class="live"><span class="dot"></span><span id="status">STANDBY</span></div></header>
<div class="panel">
<div class="row"><span>CAMERA</span><b id="cam">OFF</b></div>
<div class="row"><span>FACE AI</span><b id="face">OFF</b></div>
<div class="row"><span>HAND AI</span><b id="hand">OFF</b></div>
<div class="row"><span>GESTURE</span><b id="gesture">NONE</b></div>
<div class="row"><span>RENDER FPS</span><b id="fps">--</b></div>
<div class="row"><span>AI FPS</span><b id="aifps">--</b></div>
</div>
<button id="start">START CAMERA</button><div id="hint">LITE MODE · 为老款 Mac 优化</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script>
const video=document.getElementById("camera"),canvas=document.getElementById("fx"),ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,mirror=true,faceMesh,handModel,stream,running=false,aiBusy=false;
let face=null,hand=null,particles=[],lastFaceAI=0,lastHandAI=0,renderFrames=0,aiFrames=0,lastStats=performance.now(),lastFaceAt=0,lastHandAt=0;

function resize(){dpr=Math.min(devicePixelRatio||1,1.25);W=canvas.clientWidth;H=canvas.clientHeight;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener("resize",resize);resize();
function p(q){return{x:(mirror?1-q.x:q.x)*W,y:q.y*H}}
function faceBox(lm){
 let x1=1,y1=1,x2=0,y2=0;for(const q of lm){x1=Math.min(x1,q.x);y1=Math.min(y1,q.y);x2=Math.max(x2,q.x);y2=Math.max(y2,q.y)}
 const A=p({x:x1,y:y1}),B=p({x:x2,y:y2}),r={x:Math.min(A.x,B.x)-7,y:Math.min(A.y,B.y)-7,w:Math.abs(B.x-A.x)+14,h:Math.abs(B.y-A.y)+14};
 ctx.save();ctx.strokeStyle="#ffd21c";ctx.lineWidth=1.7;ctx.strokeRect(r.x,r.y,r.w,r.h);ctx.fillStyle="#ffd21c";ctx.font="9px sans-serif";ctx.fillText("FACE",r.x,r.y-7);ctx.restore();return r
}
function drawHand(lm){
 const links=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20]];
 ctx.save();ctx.strokeStyle="#ffd21c";ctx.fillStyle="#ffd21c";ctx.lineWidth=1;ctx.globalAlpha=.7;
 for(const z of links){const a=p(lm[z[0]]),b=p(lm[z[1]]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 for(const i of [4,8,12,16,20]){const q=p(lm[i]);ctx.beginPath();ctx.arc(q.x,q.y,2.2,0,Math.PI*2);ctx.fill()}ctx.restore()
}
function spawn(cx,cy,n){
 if(particles.length>45)return;
 for(let i=0;i<n;i++){const a=Math.random()*6.28,s=.35+Math.random()*1.3;particles.push({x:cx,y:cy,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:25+Math.random()*35})}
}
function render(){
 if(!running)return;
 ctx.clearRect(0,0,W,H);let target=null;
 if(face && performance.now()-lastFaceAt<800){const b=faceBox(face);target={x:b.x+b.w/2,y:b.y+b.h/2};$("face").textContent="TRACKING"}
 else $("face").textContent="SEARCHING";
 if(hand && performance.now()-lastHandAt<900){drawHand(hand);const q=p(hand[9]);target=q;$("hand").textContent="TRACKING"}
 else $("hand").textContent="SEARCHING";
 if(target)spawn(target.x,target.y,1);
 ctx.save();ctx.fillStyle="#ffd21c";
 for(let i=particles.length-1;i>=0;i--){const q=particles[i];if(target){q.vx+=(target.x-q.x)*.0006;q.vy+=(target.y-q.y)*.0006}q.x+=q.vx;q.y+=q.vy;q.vx*=.99;q.vy*=.99;q.life--;ctx.globalAlpha=q.life/60;ctx.fillRect(q.x,q.y,1.5,1.5);if(q.life<=0)particles.splice(i,1)}
 ctx.restore();
 renderFrames++;const now=performance.now();if(now-lastStats>1000){$("fps").textContent=renderFrames;$("aifps").textContent=aiFrames;renderFrames=0;aiFrames=0;lastStats=now}$("gesture").textContent=hand?"HAND":"FACE";requestAnimationFrame(render)
}
async function aiLoop(){
 if(!running)return;
 const now=performance.now();
 if(!aiBusy){
  aiBusy=true;
  try{
   // Face: ~5 FPS
   if(now-lastFaceAI>200){lastFaceAI=now;await faceMesh.send({image:video});aiFrames++;lastFaceAt=now}
   // Hands: ~2 FPS, staggered away from Face
   if(now-lastHandAI>500){lastHandAI=now;await handModel.send({image:video});aiFrames++;lastHandAt=now}
  }catch(e){console.warn("AI frame skipped",e)}
  aiBusy=false;
 }
 setTimeout(aiLoop,30);
}
async function initAI(){
 faceMesh=new FaceMesh({locateFile:f=>"https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/"+f});
 faceMesh.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:.55,minTrackingConfidence:.55});
 faceMesh.onResults(r=>{face=(r.multiFaceLandmarks||[])[0]||null});
 handModel=new Hands({locateFile:f=>"https://cdn.jsdelivr.net/npm/@mediapipe/hands/"+f});
 handModel.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.6});
 handModel.onResults(r=>{hand=(r.multiHandLandmarks||[])[0]||null});
 $("face").textContent="READY";$("hand").textContent="READY"
}
$("start").onclick=async()=>{
 const b=$("start");b.disabled=true;$("status").textContent="STARTING";
 try{
  if(!navigator.mediaDevices?.getUserMedia)throw new Error("NO_CAMERA_API");
  stream=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:480,max:640},height:{ideal:360,max:480},frameRate:{ideal:24,max:30},facingMode:"user"},audio:false});
  video.srcObject=stream;await video.play();$("cam").textContent="ON";$("status").textContent="LIVE";running=true;b.style.display="none";
  await initAI();render();aiLoop();
 }catch(e){console.error(e);$("status").textContent="ERROR";$("cam").textContent="ERROR";b.disabled=false;b.textContent="TRY AGAIN";alert("摄像头启动失败。请检查浏览器权限，并用 HTTPS / GitHub Pages / localhost 打开。")}
};
</script></body></html>
